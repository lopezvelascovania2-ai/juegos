<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energía Renovable — Aprende Jugando</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel2: #24334a;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent2: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  #progressWrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    margin: 20px 0 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #progressBar {
    flex: 1;
    height: 10px;
    background: var(--bg);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.4s ease;
  }
  #progressLabel { font-size: 13px; color: var(--muted); white-space: nowrap; font-weight: 600; }

  .path { position: relative; padding-left: 6px; }
  .path::before {
    content: "";
    position: absolute;
    left: 27px;
    top: 30px;
    bottom: 30px;
    width: 2px;
    background: var(--border);
    z-index: 0;
  }
  .node {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: inherit;
    margin-bottom: 14px;
    padding: 12px;
    border-radius: 14px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .node:hover { background: var(--panel); transform: translateX(2px); }
  .badge {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: var(--panel2);
    border: 2px solid var(--border);
  }
  .node.done .badge {
    border-color: var(--accent);
    background: radial-gradient(circle, rgba(34,197,94,0.25), var(--panel2));
  }
  .card {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h3 { margin: 0; font-size: 15px; }
  .card p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .step-num { font-size: 11px; color: var(--muted); font-weight: 700; }
  .check { color: var(--accent); font-size: 13px; font-weight: 700; }

  footer { text-align: center; margin-top: 30px; font-size: 12px; color: #475569; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚡ Energía Renovable — Aprende Jugando</h1>
    <p>Un recorrido paso a paso: de los fundamentos de física a las tecnologías renovables y su evaluación.</p>
  </header>

  <div id="progressWrap">
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="progressLabel">0 / 8 completados</div>
  </div>

  <div class="path" id="path"></div>

  <footer>Tu progreso se guarda en este navegador (localStorage).</footer>
</div>

<script>
  const MODULES = [
    { id: 'modulo1', file: 'modulo1.html', icon: '🔋', title: '1. Energía y potencia', desc: 'Qué es energía, qué es potencia, y cómo se relacionan (E = P × t).' },
    { id: 'modulo2', file: 'modulo2.html', icon: '📉', title: '2. Eficiencia y pérdidas', desc: 'Energía útil, factor de planta, y por qué siempre se pierde algo en el camino.' },
    { id: 'modulo3', file: 'modulo3.html', icon: '🔌', title: '3. Electricidad básica', desc: 'Voltaje, corriente, resistencia, Ley de Ohm y potencia eléctrica.' },
    { id: 'modulo4', file: 'modulo4.html', icon: '💨', title: '4. Fluidos', desc: 'Caudal, presión, velocidad — la base de la energía eólica e hidráulica.' },
    { id: 'modulo5', file: 'modulo5.html', icon: '🔥', title: '5. Transferencia de calor', desc: 'Conducción, convección y radiación — clave en solar térmica y geotermia.' },
    { id: 'modulo6', file: 'modulo6.html', icon: '♨️', title: '6. Termodinámica aplicada', desc: 'Límites de eficiencia (Carnot) en plantas geotérmicas y de biomasa.' },
    { id: 'modulo7', file: 'modulo7.html', icon: '🌎', title: '7. Tecnologías renovables', desc: 'Solar, eólica, hidráulica, geotérmica, biogás, hidrógeno y más — calculadoras interactivas.' },
    { id: 'modulo8', file: 'modulo8.html', icon: '💰', title: '8. Evaluación de proyectos', desc: 'CAPEX, OPEX, LCOE, retorno de inversión: ¿el proyecto es viable?' },
  ];

  function getProgress() {
    try { return JSON.parse(localStorage.getItem('energia_progress') || '{}'); }
    catch { return {}; }
  }

  function render() {
    const progress = getProgress();
    const pathEl = document.getElementById('path');
    pathEl.innerHTML = '';
    let doneCount = 0;

    MODULES.forEach((m, i) => {
      const done = !!(progress[m.id] && progress[m.id].completed);
      if (done) doneCount++;
      const a = document.createElement('a');
      a.href = m.file;
      a.className = 'node' + (done ? ' done' : '');
      a.innerHTML = `
        <div class="badge">${done ? '✅' : m.icon}</div>
        <div class="card">
          <div class="top">
            <h3>${m.title}</h3>
            ${done ? `<span class="check">${progress[m.id].score != null ? progress[m.id].score + ' pts' : 'Hecho'}</span>` : ''}
          </div>
          <p>${m.desc}</p>
        </div>
      `;
      pathEl.appendChild(a);
    });

    const pct = Math.round((doneCount / MODULES.length) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `${doneCount} / ${MODULES.length} completados`;
  }

  render();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memoria a Distancia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Karla:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg-0:#0a1f1a;
  --bg-1:#123a30;
  --bg-2:#0d2b23;
  --edge:#071813;
  --gold:#dba847;
  --gold-ink:#3a2909;
  --gold-soft:rgba(219,168,71,.18);
  --teal:#6fa8ad;
  --teal-soft:rgba(111,168,173,.18);
  --cream:#f3ecd9;
  --ink:#182620;
  --muted:#9fb6ac;
  --mismatch:#c8624a;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Karla', system-ui, sans-serif;
  --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100dvh;
  background:
    radial-gradient(ellipse at top, rgba(255,255,255,.05), transparent 60%),
    var(--bg-0);
  color:var(--cream);
  font-family:var(--font-body);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;
}
#app{ width:100%; max-width:520px; }
.eyebrow{
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:.72rem;
  font-weight:600;
  color:var(--muted);
  text-align:center;
  margin:0 0 6px;
}
h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(1.7rem,5vw,2.3rem);
  text-align:center;
  margin:0 0 8px;
  text-wrap:balance;
  color:var(--cream);
}
.tagline{
  text-align:center;
  color:var(--muted);
  font-size:.92rem;
  max-width:40ch;
  margin:0 auto 26px;
  line-height:1.55;
}
.panel{
  background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  border:1px solid var(--edge);
  border-radius:22px;
  padding:22px;
  box-shadow:0 24px 44px -22px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.05);
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display); font-weight:600; font-size:1.05rem;
  flex-shrink:0;
}
.avatar.p1{background:var(--gold-soft); color:var(--gold);}
.avatar.p2{background:var(--teal-soft); color:var(--teal);}
.name-form{display:flex; gap:12px; flex-direction:column;}
input[type=text]{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.25);
  color:var(--cream);
  font-family:var(--font-body);
  font-size:1rem;
}
input[type=text]::placeholder{ color:var(--muted); }
input[type=text]:focus{outline:2px solid var(--gold); outline-offset:1px;}
.btn{
  appearance:none; border:none; cursor:pointer;
  font-family:var(--font-body); font-weight:700; font-size:.95rem;
  padding:12px 20px; border-radius:10px;
  background:var(--gold); color:var(--gold-ink);
  transition:transform .15s ease, filter .15s ease;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.97);}
.btn:focus-visible{outline:2px solid var(--cream); outline-offset:2px;}
.btn.ghost{ background:transparent; color:var(--muted); font-weight:600; padding:8px 10px; text-decoration:underline; }
.btn.block{ width:100%; }
.scoreboard{ display:flex; gap:10px; margin-bottom:18px; }
.chip{
  flex:1; display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:14px;
  background:rgba(0,0,0,.2); border:1px solid transparent; min-width:0;
}
.chip.active.p1{ border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
.chip.active.p2{ border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
.chip-name{ font-weight:700; font-size:.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip-turn{ font-size:.66rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
.chip-score{ margin-left:auto; font-family:var(--font-display); font-size:1.35rem; font-variant-numeric:tabular-nums; }
.board{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.board.board-disabled{ opacity:.5; pointer-events:none; }
.card-slot{ aspect-ratio:3/4; perspective:900px; }
.card{
  position:relative; width:100%; height:100%;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.2,.8,.3,1);
  cursor:pointer;
}
.card.flipped{ transform:rotateY(180deg); }
.card.matched{ cursor:default; }
.card.mismatch .face.front{ border-color:var(--mismatch); }
.face{
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius:12px; display:flex; align-items:center; justify-content:center;
  border:2px solid transparent;
}
.face.back{
  background:
    repeating-linear-gradient(45deg, var(--gold-soft) 0 8px, transparent 8px 16px),
    linear-gradient(145deg, var(--bg-1), var(--bg-2));
  border-color:var(--edge);
}
.face.back::after{ content:"\2726"; color:var(--gold); font-size:1.1rem; opacity:.85; }
.face.front{
  transform:rotateY(180deg);
  background:var(--cream); color:var(--ink);
  font-size:clamp(1.5rem,6vw,2.1rem);
  border-color:rgba(0,0,0,.06);
}
.card.matched .face.front{ background:var(--gold-soft); }
.status-line{ text-align:center; margin-top:16px; color:var(--muted); font-size:.85rem; min-height:1.2em; }
.last-move{
  text-align:center; color:var(--muted); font-size:.82rem;
  margin:0 0 16px; padding:8px 12px; border-radius:10px;
  background:rgba(0,0,0,.18);
}
.last-move strong{ color:var(--cream); }
.finished-banner{ text-align:center; margin-bottom:16px; }
.finished-banner .winner{ font-family:var(--font-display); font-size:1.4rem; color:var(--gold); }
.footer-actions{ display:flex; justify-content:center; align-items:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
.divider{ display:flex; align-items:center; gap:10px; margin:20px 0 14px; color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; }
.divider::before,.divider::after{ content:''; flex:1; height:1px; background:rgba(255,255,255,.12); }
.join-box{ display:flex; gap:8px; }
.join-box input[type=text]{ flex:1; }
.code-error{ color:var(--mismatch); font-size:.8rem; min-height:1em; margin:6px 0 0; }
.room-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:16px; padding:8px 14px; border-radius:12px;
  background:rgba(0,0,0,.18);
}
.room-row .room-label{ font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
.room-row .room-code{ font-family:var(--font-mono); font-size:1.1rem; font-weight:700; letter-spacing:.06em; color:var(--gold); }
.room-row .btn{ padding:6px 12px; font-size:.78rem; }
@media (prefers-reduced-motion:reduce){ .card{ transition:none; } }
@media (max-width:380px){ .board{ gap:7px; } .avatar{ width:32px; height:32px; font-size:.9rem; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const SYMBOLS = ['🌵','🍩','🎈','🐙','🌈','🎧','🍉','🦋'];
const HIDE_DELAY = 2600;
const POLL_MS = 2000;
const KVDB_BASE = 'https://kvdb.io/DAWWWCZTe3hvz7MTaYpCHi';
const ROOM_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

let game = null;
let roomCode = null;
let myRole = null;
let view = 'setup';
let revealed = [];
let locked = false;
let localPick = [];
let mismatchTimer = null;
let pollTimer = null;
let pollBusy = false;

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function shuffledDeck(){
  const cards = [];
  SYMBOLS.forEach(sym => { cards.push({symbol:sym, matched:false}); cards.push({symbol:sym, matched:false}); });
  for(let i=cards.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]] = [cards[j],cards[i]];
  }
  return cards;
}

function randomRoomCode(){
  let s = '';
  for(let i=0;i<5;i++) s += ROOM_CHARS[Math.floor(Math.random()*ROOM_CHARS.length)];
  return s;
}

async function kvGet(code){
  const res = await fetch(`${KVDB_BASE}/room-${code}`, { cache: 'no-store' });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('kv-get-failed');
  return res.json();
}

async function kvPut(code, state){
  const res = await fetch(`${KVDB_BASE}/room-${code}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(state)
  });
  if(!res.ok) throw new Error('kv-put-failed');
}

async function pushState(){
  if(!roomCode || !game) return;
  try { await kvPut(roomCode, game); } catch(err){ /* next poll or action will reconcile */ }
}

function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(pollRoom, POLL_MS);
}

async function pollRoom(){
  if(!roomCode || pollBusy) return;
  pollBusy = true;
  try {
    const remote = await kvGet(roomCode);
    if(remote && remote.rev > (game ? game.rev : -1)){
      game = remote;
      syncViewFromGame();
      render();
    }
  } catch(err){ /* transient network hiccup; try again next tick */ }
  pollBusy = false;
}

function syncViewFromGame(){
  revealed = game.revealed || [];
  locked = !!game.mismatchPending;
  view = game.deck.every(c => c.matched) ? 'finished' : 'playing';
  scheduleMismatchHideIfNeeded();
}

function render(){
  document.getElementById('app').innerHTML = view === 'setup' ? renderSetup() : renderGame();
  attachHandlers();
}

function renderSetup(){
  return `
    <p class="eyebrow">Juego de memoria</p>
    <h1>Memoria a Distancia</h1>
    <p class="tagline">Un juego de parejas por turnos para jugar con alguien aunque estén lejos. Crea una sala, comparte el código, y el tablero se actualiza solo para las dos.</p>
    <div class="panel">
      <form class="name-form" id="create-form">
        <input type="text" id="my-name" placeholder="Tu nombre" maxlength="18" autocomplete="off" required>
        <input type="text" id="other-name" placeholder="Nombre de la otra persona" maxlength="18" autocomplete="off" required>
        <button type="submit" class="btn block">Crear sala y jugar primero</button>
      </form>
      <div class="divider"><span>o únete a una sala</span></div>
      <form class="name-form" id="join-form">
        <input type="text" id="join-name" placeholder="Tu nombre" maxlength="18" autocomplete="off" required>
        <div class="join-box">
          <input type="text" id="join-code" placeholder="Código de sala" maxlength="5" autocomplete="off" required style="text-transform:uppercase;">
          <button type="submit" class="btn">Unirme</button>
        </div>
        <p class="code-error" id="join-error"></p>
      </form>
    </div>`;
}

function renderChip(role){
  const name = game.players[role];
  const active = view === 'playing' && !locked && game.turn === role && game.players.p2;
  return `
    <div class="chip ${role} ${active ? 'active' : ''}">
      <div class="avatar ${role}">${name ? esc(name[0].toUpperCase()) : '?'}</div>
      <div style="min-width:0;">
        <div class="chip-name">${name ? esc(name) : 'Esperando…'}</div>
        <div class="chip-turn">${active ? 'Su turno' : ''}</div>
      </div>
      <div class="chip-score">${game.scores[role]}</div>
    </div>`;
}

function renderCard(card, idx){
  const flipped = card.matched || revealed.includes(idx);
  const classes = ['card'];
  if(flipped) classes.push('flipped');
  if(card.matched) classes.push('matched');
  if(locked && revealed.includes(idx)) classes.push('mismatch');
  return `
    <div class="card-slot">
      <div class="${classes.join(' ')}" data-idx="${idx}">
        <div class="face back"></div>
        <div class="face front">${flipped ? card.symbol : ''}</div>
      </div>
    </div>`;
}

function renderLastMove(){
  if(!game.lastMove) return '';
  const { by, symbolA, symbolB, matched } = game.lastMove;
  const name = esc(game.players[by]);
  const outcome = matched ? '¡encontró pareja!' : 'no coincidieron.';
  return `<p class="last-move"><strong>${name}</strong> volteó ${symbolA} y ${symbolB} — ${outcome}</p>`;
}

function renderGame(){
  const board = game.deck.map((c,i) => renderCard(c,i)).join('');
  let banner = '';
  if(view === 'finished'){
    const p1 = game.players.p1, p2 = game.players.p2;
    const winner = game.scores.p1 === game.scores.p2 ? null : (game.scores.p1 > game.scores.p2 ? p1 : p2);
    banner = `<div class="finished-banner"><div class="winner">${winner ? `¡Ganó ${esc(winner)}!` : '¡Empate!'}</div></div>`;
  }
  let statusLine = '';
  if(!game.players.p2){
    statusLine = 'Esperando a que se una la otra persona…';
  } else if(view === 'playing'){
    const activeName = game.players[game.turn];
    const myTurn = myRole && game.turn === myRole;
    if(locked){ statusLine = 'Volteando de nuevo…'; }
    else if(myTurn){ statusLine = 'Es tu turno: elige dos cartas.'; }
    else { statusLine = `Turno de ${esc(activeName)}…`; }
  }
  const canClick = !!(myRole && view === 'playing' && !locked && game.turn === myRole && game.players.p2);
  return `
    <p class="eyebrow">Juego de memoria</p>
    <h1>Memoria a Distancia</h1>
    <div class="panel">
      <div class="room-row">
        <div><span class="room-label">Sala</span> <span class="room-code">${esc(roomCode)}</span></div>
        <button class="btn ghost" id="copy-room-btn" type="button">Copiar código</button>
      </div>
      <div class="scoreboard">
        ${renderChip('p1')}
        ${renderChip('p2')}
      </div>
      ${renderLastMove()}
      ${banner}
      <div class="board ${canClick ? '' : 'board-disabled'}">${board}</div>
      <p class="status-line">${statusLine}</p>
      <div class="footer-actions">
        ${view === 'finished' && myRole ? '<button class="btn" id="rematch-btn" type="button">Jugar de nuevo</button>' : ''}
        <button class="btn ghost" id="reset-btn" type="button">Salir de la sala</button>
      </div>
    </div>`;
}

function attachHandlers(){
  const app = document.getElementById('app');
  const createForm = document.getElementById('create-form');
  if(createForm){
    createForm.addEventListener('submit', e => {
      e.preventDefault();
      const myName = document.getElementById('my-name').value.trim();
      const otherName = document.getElementById('other-name').value.trim();
      if(!myName || !otherName) return;
      createRoom(myName, otherName);
    });
  }
  const joinForm = document.getElementById('join-form');
  if(joinForm){
    joinForm.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('join-name').value.trim();
      const code = document.getElementById('join-code').value.trim().toUpperCase();
      if(!name || !code) return;
      joinRoom(code, name);
    });
  }
  const copyRoomBtn = document.getElementById('copy-room-btn');
  if(copyRoomBtn){
    copyRoomBtn.addEventListener('click', () => {
      navigator.clipboard && navigator.clipboard.writeText(roomCode).then(() => {
        const original = copyRoomBtn.textContent;
        copyRoomBtn.textContent = '¡Copiado!';
        setTimeout(() => { copyRoomBtn.textContent = original; }, 1500);
      }).catch(() => {});
    });
  }
  const rematchBtn = document.getElementById('rematch-btn');
  if(rematchBtn){
    rematchBtn.addEventListener('click', startRematch);
  }
  const resetBtn = document.getElementById('reset-btn');
  if(resetBtn){
    resetBtn.addEventListener('click', () => {
      if(confirm('¿Salir de esta sala?')){
        leaveRoom();
      }
    });
  }
  if(app){
    app.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', () => onCardClick(parseInt(el.dataset.idx, 10)));
    });
  }
}

async function createRoom(myName, otherName){
  const code = randomRoomCode();
  const state = {
    rev: 1,
    players: { p1: myName, p2: null },
    turn: 'p1',
    scores: { p1: 0, p2: 0 },
    deck: shuffledDeck(),
    revealed: [],
    mismatchPending: false,
    pendingSince: null,
    lastMove: null
  };
  try {
    await kvPut(code, state);
  } catch(err){
    alert('No se pudo crear la sala. Revisa tu conexión e intenta de nuevo.');
    return;
  }
  roomCode = code;
  myRole = 'p1';
  game = state;
  localStorage.setItem('mm_role_' + code, 'p1');
  localStorage.setItem('mm_name_' + code, myName);
  localStorage.setItem('mm_last_room', code);
  syncViewFromGame();
  render();
  startPolling();
}

async function joinRoom(code, name){
  const errorEl = document.getElementById('join-error');
  if(errorEl) errorEl.textContent = '';
  let remote;
  try {
    remote = await kvGet(code);
  } catch(err){
    if(errorEl) errorEl.textContent = 'No se pudo conectar. Intenta de nuevo.';
    return;
  }
  if(!remote){
    if(errorEl) errorEl.textContent = 'No se encontró esa sala. Revisa el código.';
    return;
  }
  const storedRole = localStorage.getItem('mm_role_' + code);
  const storedName = localStorage.getItem('mm_name_' + code);
  if(storedRole && remote.players[storedRole] === storedName){
    roomCode = code; myRole = storedRole; game = remote;
  } else if(!remote.players.p2){
    remote.players.p2 = name;
    remote.rev += 1;
    try { await kvPut(code, remote); } catch(err){
      if(errorEl) errorEl.textContent = 'No se pudo unir. Intenta de nuevo.';
      return;
    }
    roomCode = code; myRole = 'p2'; game = remote;
    localStorage.setItem('mm_role_' + code, 'p2');
    localStorage.setItem('mm_name_' + code, name);
    localStorage.setItem('mm_last_room', code);
  } else {
    if(errorEl) errorEl.textContent = 'Esa sala ya tiene dos jugadores.';
    return;
  }
  syncViewFromGame();
  render();
  startPolling();
}

function leaveRoom(){
  stopPolling();
  clearTimeout(mismatchTimer);
  if(roomCode){
    localStorage.removeItem('mm_role_' + roomCode);
    localStorage.removeItem('mm_name_' + roomCode);
  }
  localStorage.removeItem('mm_last_room');
  roomCode = null; myRole = null; game = null;
  view = 'setup'; revealed = []; locked = false;
  render();
}

async function startRematch(){
  if(!myRole || !game) return;
  game.deck = shuffledDeck();
  game.scores = { p1: 0, p2: 0 };
  game.revealed = [];
  game.mismatchPending = false;
  game.pendingSince = null;
  game.lastMove = null;
  game.turn = 'p1';
  game.rev += 1;
  syncViewFromGame();
  render();
  await pushState();
}

function onCardClick(idx){
  if(!myRole || view !== 'playing' || locked) return;
  if(!game.players.p2 || game.turn !== myRole) return;
  if(game.deck[idx].matched) return;
  if(revealed.includes(idx)) return;
  if(localPick.includes(idx)) return;
  localPick.push(idx);
  if(localPick.length === 1){
    revealed = [idx];
    game.revealed = [idx];
    game.rev += 1;
    render();
    pushState();
    return;
  }
  const [a,b] = localPick;
  localPick = [];
  revealed = [a,b];
  const match = game.deck[a].symbol === game.deck[b].symbol;
  game.lastMove = { by: game.turn, symbolA: game.deck[a].symbol, symbolB: game.deck[b].symbol, matched: match };
  if(match){
    game.deck[a].matched = true;
    game.deck[b].matched = true;
    game.scores[game.turn] += 1;
    game.revealed = [];
    game.mismatchPending = false;
    game.pendingSince = null;
    revealed = [];
    if(game.deck.every(c => c.matched)) view = 'finished';
    game.rev += 1;
    render();
    pushState();
  } else {
    game.revealed = [a,b];
    game.mismatchPending = true;
    game.pendingSince = Date.now();
    locked = true;
    game.rev += 1;
    render();
    pushState();
    scheduleMismatchHideIfNeeded();
  }
}

function scheduleMismatchHideIfNeeded(){
  clearTimeout(mismatchTimer);
  if(!(game && game.mismatchPending && game.pendingSince)) return;
  if(myRole !== game.turn) return;
  const wait = Math.max(150, HIDE_DELAY - (Date.now() - game.pendingSince));
  mismatchTimer = setTimeout(() => {
    if(!game || !game.mismatchPending) return;
    game.revealed = [];
    game.mismatchPending = false;
    game.pendingSince = null;
    game.turn = game.turn === 'p1' ? 'p2' : 'p1';
    game.rev += 1;
    revealed = [];
    locked = false;
    render();
    pushState();
  }, wait);
}

async function boot(){
  const lastRoom = localStorage.getItem('mm_last_room');
  if(lastRoom){
    const role = localStorage.getItem('mm_role_' + lastRoom);
    const name = localStorage.getItem('mm_name_' + lastRoom);
    if(role && name){
      try {
        const remote = await kvGet(lastRoom);
        if(remote && remote.players[role] === name){
          roomCode = lastRoom; myRole = role; game = remote;
          syncViewFromGame();
          render();
          startPolling();
          return;
        }
      } catch(err){ /* fall through to setup */ }
      localStorage.removeItem('mm_last_room');
    }
  }
  render();
}

boot();
</script>
</body>
</html>

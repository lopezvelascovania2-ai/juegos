<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viborita</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --accent: #22c55e;
    --accent2: #16a34a;
    --food: #ef4444;
    --grid: #16213a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    gap: 12px;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 1px;
  }
  #scoreboard {
    display: flex;
    gap: 24px;
    font-size: 16px;
    background: var(--panel);
    padding: 8px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  #scoreboard span { font-weight: 700; color: var(--accent); }
  #gameWrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  canvas {
    display: block;
    background: var(--grid);
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 22px; }
  #overlay p { margin: 0; color: #94a3b8; font-size: 14px; }
  button {
    background: var(--accent);
    color: #052e16;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--accent2); }
  button:active { transform: scale(0.96); }
  #controls {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(2, 52px);
    gap: 6px;
    margin-top: 4px;
  }
  #controls button.dpad {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 20px;
    padding: 0;
  }
  #controls button.dpad:hover { background: #263449; }
  .up { grid-column: 2; grid-row: 1; }
  .left { grid-column: 1; grid-row: 2; }
  .down { grid-column: 2; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  #hint { font-size: 13px; color: #64748b; }
  @media (min-width: 700px) {
    #controls { display: none; }
  }
</style>
</head>
<body>
  <h1>🐍 Viborita</h1>
  <div id="scoreboard">
    <div>Puntos: <span id="score">0</span></div>
    <div>Mejor: <span id="best">0</span></div>
  </div>

  <div id="gameWrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">¡Presiona para jugar!</h2>
      <p id="overlayText">Usa las flechas, WASD, o los botones para moverte.</p>
      <button id="startBtn">Iniciar</button>
    </div>
  </div>

  <div id="controls">
    <button class="dpad up" data-dir="up">↑</button>
    <button class="dpad left" data-dir="left">←</button>
    <button class="dpad down" data-dir="down">↓</button>
    <button class="dpad right" data-dir="right">→</button>
  </div>

  <p id="hint">Flechas / WASD para moverte · Espacio para pausar</p>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const cell = 20;
  const cols = canvas.width / cell;
  const rows = canvas.height / cell;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  let best = Number(localStorage.getItem('viborita_best') || 0);
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, speedMs, timer, running, paused;

  function init() {
    snake = [
      { x: Math.floor(cols / 2), y: Math.floor(rows / 2) },
      { x: Math.floor(cols / 2) - 1, y: Math.floor(rows / 2) },
      { x: Math.floor(cols / 2) - 2, y: Math.floor(rows / 2) },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speedMs = 130;
    paused = false;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * cols),
        y: Math.floor(Math.random() * rows),
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function draw() {
    ctx.fillStyle = '#16213a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid subtle lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i <= cols; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cell, 0);
      ctx.lineTo(i * cell, canvas.height);
      ctx.stroke();
    }
    for (let j = 0; j <= rows; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * cell);
      ctx.lineTo(canvas.width, j * cell);
      ctx.stroke();
    }

    // food
    ctx.fillStyle = '#ef4444';
    roundRect(food.x * cell + 2, food.y * cell + 2, cell - 4, cell - 4, 5);
    ctx.fill();

    // snake
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#22c55e' : '#4ade80';
      roundRect(seg.x * cell + 1, seg.y * cell + 1, cell - 2, cell - 2, 5);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function step() {
    if (paused) return;

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
      return gameOver();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      placeFood();
      if (speedMs > 60) {
        speedMs -= 3;
        restartTimer();
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(step, speedMs);
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('viborita_best', best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = '¡Perdiste!';
    overlayText.textContent = `Puntuación: ${score}. Presiona para jugar de nuevo.`;
    startBtn.textContent = 'Reintentar';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    init();
    draw();
    running = true;
    overlay.classList.add('hidden');
    restartTimer();
  }

  function setDir(x, y) {
    // prevent reversing directly into itself
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    overlayTitle.textContent = 'Pausa';
    overlayText.textContent = 'Presiona espacio o el botón para continuar.';
    startBtn.textContent = 'Continuar';
    overlay.classList.toggle('hidden', !paused);
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDir(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDir(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1, 0); e.preventDefault(); break;
      case ' ':
        e.preventDefault();
        if (!running) startGame();
        else togglePause();
        break;
    }
  });

  document.querySelectorAll('.dpad').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.dir;
      if (d === 'up') setDir(0, -1);
      if (d === 'down') setDir(0, 1);
      if (d === 'left') setDir(-1, 0);
      if (d === 'right') setDir(1, 0);
    });
  });

  // swipe support for mobile
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, { passive: true });

  startBtn.addEventListener('click', () => {
    if (paused) { togglePause(); }
    else { startGame(); }
  });

  init();
  draw();
})();
</script>
</body>
</html>
